ensemble:
  exp_id: local_test_al
  out_dir: runs/local_test_al
  members: 3
  seeds:
  - 101
  - 102
  - 103
data:
  seed_path: data/processed/ala2/split_test/al_seed.pt
  pool_path: data/processed/ala2/split_test/al_pool_ref.pt
  val_path: data/processed/ala2/split_test/al_val.pt
  meta_path: data/processed/ala2/meta.pt
  batch_size: 32  # Small batch for local test
  num_workers: 0  # 0 workers for local debug to avoid multiprocessing issues
model:
  type: egnn
  n_layers: 2     # Reduced for speed
  hidden_dim: 32  # Reduced for speed
  time_emb_dim: 32
diffusion:
  T: 100
  beta_start: 0.0001
  beta_end: 0.02
  schedule: cosine
  recenter_every_step: true
train:
  seed: 42
  epochs: 1      # Just 1 epoch to verify it runs
  lr: 0.001
  grad_clip: 1.0
  rot_aug: true
active_learning:
  exp_id: local_test_al
  out_dir: runs/local_test_al
  initial_seed_size: 100
  oracle_pool_source: data/processed/ala2/shards
  split_out_dir: data/processed/ala2/split_test
  seed_traj: 0
  val_traj: 1
  val_size: 200
  n_iters: 2      # 2 iterations to check the loop logic
  n_candidates: 50
  n_acquire: 10
  acquisition_strategy: uncertainty
  finetune_epochs: 1
  eval_samples: 20
  sample_batch_size: 20
  sample_steps: 10
  oracle_batch_size: 20
  oracle_device: cpu
  rmsd_thresh: 0.75
  phi_psi_bins: 180
  seed: 123
