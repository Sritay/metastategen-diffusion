ensemble:
  exp_id: "day8_9_al"
  out_dir: "runs/day8_9_al"
  members: 3
  seeds: [111, 222, 333]

data:
  seed_path: "data/processed/ala2/al_seed.pt"
  pool_path: "data/processed/ala2/al_pool_ref.pt"
  val_path: "data/processed/ala2/al_val.pt"
  meta_path: "data/processed/ala2/meta.pt"
  batch_size: 256
  num_workers: 4

model:
  type: "egnn"
  n_layers: 4
  hidden_dim: 128
  time_emb_dim: 128

diffusion:
  T: 1000
  beta_start: 0.0001
  beta_end: 0.02
  schedule: "cosine"
  recenter_every_step: True

train:
  seed: 42
  epochs: 10
  lr: 3.0e-4
  grad_clip: 1.0
  rot_aug: true

active_learning:
  exp_id: "day8_9_al"
  out_dir: "runs/day8_9_al"
  initial_seed_size: 100
  oracle_pool_source: "data/processed/ala2/shards"
  split_out_dir: "data/processed/ala2"
  seed_traj: 0
  val_traj: 2
  val_size: 2000
  n_iters: 3
  n_candidates: 1000
  n_acquire: 200
  acquisition_strategy: "uncertainty"
  finetune_epochs: 5
  eval_samples: 1000
  sample_batch_size: 200
  sample_steps: 100
  sample_eta: 0.0
  oracle_batch_size: 100
  oracle_device: "cpu"
  rmsd_thresh: 0.75
  phi_psi_bins: 180
  seed: 123
