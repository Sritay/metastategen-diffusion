project: "metastategen-energy-debug"
experiment_name: "debug_cluster_smoke_test"

data:
  forces_path: "data/processed/ala2/al_forces_ref.pt"
  energies_path: "data/processed/ala2/al_energies_ref.pt"
  processed_dir: "data/processed/ala2/shards"
  batch_size: 32
  num_workers: 0 
  train_trajs: [0]
  val_trajs: [1]
  subsample: 100 # Match local debug run (1/100th of data)

model:
  n_atom_types: 5 
  hidden_dim: 64
  n_layers: 2
  dropout: 0.0
  use_rbf: true
  rbf_dim: 32
  rbf_cutoff: 1.0

training:
  lr: 3.0e-4    # Match local debug run (Aggressive LR)
  weight_decay: 1.0e-6
  max_epochs: 2
  patience: 20
  grad_clip: 10.0
  energy_weight: 1.0e-4  
  save_every: 1

logging:
  log_every_n_steps: 10
  wandb: false
