project: "metastategen-force"
experiment_name: "force_surrogate_ala2"

data:
  meta_path: "data/processed/ala2/meta.pt"
  forces_path: "data/processed/ala2/al_forces_ref.pt"
  processed_dir: "data/processed/ala2/shards"
  batch_size: 256
  num_workers: 4

model:
  n_atom_types: 5 # C, N, O, S, other
  hidden_dim: 256
  n_layers: 6
  dropout: 0.0

training:
  lr: 3.0e-4
  weight_decay: 1.0e-6
  max_epochs: 100
  patience: 20
  grad_clip: 1.0

logging:
  log_every_n_steps: 50
  wandb: true
