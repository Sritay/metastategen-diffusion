ensemble:
  exp_id: day10_al_12_hpc
  out_dir: runs/day10_al_12_hpc
  members: 3
  seeds:
  - 111
  - 222
  - 333
data:
  seed_path: data/processed/ala2/split_12/al_seed.pt  # Using split_12
  pool_path: data/processed/ala2/split_12/al_pool_ref.pt
  val_path: data/processed/ala2/split_12/al_val.pt    # Large 20k validation set
  meta_path: data/processed/ala2/meta.pt
  batch_size: 1024
  num_workers: 4
  scale_factor: 7.6
model:
  type: egnn
  n_layers: 4
  hidden_dim: 128
  time_emb_dim: 128
  use_rbf: true      
  rbf_dim: 128       
  rbf_cutoff: 20.0   
diffusion:
  T: 1000
  beta_start: 0.0001
  beta_end: 0.02
  schedule: cosine
  recenter_every_step: true
train:
  seed: 42
  epochs: 500
  lr: 0.0003
  grad_clip: 1.0
  rot_aug: true
active_learning:
  exp_id: day10_al_12_hpc
  out_dir: runs/day10_al_12_hpc
  initial_seed_size: 5000 
  oracle_pool_source: data/processed/ala2/shards
  split_out_dir: data/processed/ala2/split_12
  seed_traj: 0
  val_traj: -1
  val_size: 20000     # Reflects the larger set
  n_iters: 20         # Increased to 20
  n_candidates: 5000
  n_acquire: 500
  acquisition_strategy: uncertainty
  finetune_epochs: 20 
  eval_samples: 1000
  sample_batch_size: 2048
  sample_steps: 100 
  sample_eta: 0.0   # DDIM
  oracle_batch_size: 100
  oracle_device: cpu
  rmsd_thresh: 0.15   # Tightened to 0.15 nm (1.5 Angstrom)
  phi_psi_bins: 180
  seed: 123
