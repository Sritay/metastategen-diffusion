project: "metastategen-energy-debug"
experiment_name: "debug_local_cpu"

data:
  forces_path: "data/processed/ala2_all_atom/al_forces_ref.pt"
  energies_path: "data/processed/ala2_all_atom/al_energies_ref.pt"
  processed_dir: "data/processed/ala2_all_atom/shards"
  batch_size: 16
  num_workers: 0
  train_trajs: [0]
  val_trajs: [0] # Use same for debug to avoid loading too much
  subsample: 100 # Subsample to reduce data loading time/memory for local debug

model:
  n_atom_types: 6 
  hidden_dim: 32 # Small dim for speed
  n_layers: 2    # Fewer layers for speed
  dropout: 0.0
  use_rbf: true
  rbf_dim: 16
  rbf_cutoff: 1.0

training:
  lr: 3.0e-4
  weight_decay: 1.0e-6
  max_epochs: 2
  patience: 10
  grad_clip: 10.0
  force_weight: 1.0
  energy_weight: 1.0
  save_every: 1

logging:
  log_every_n_steps: 1
  wandb: false
