ensemble:
  exp_id: "day8_9_control_lite"
  out_dir: "runs/day8_9_control_lite"
  members: 3
  # Use fewer seeds or same seeds? Same seeds for fairness.
  seeds: [111, 222, 333]

data:
  seed_path: "data/processed/ala2/al_seed.pt"
  pool_path: "data/processed/ala2/al_pool_ref.pt"
  val_path: "data/processed/ala2/al_val.pt"
  meta_path: "data/processed/ala2/meta.pt"
  batch_size: 64 # Reduced from 256
  num_workers: 0

model:
  type: "egnn"
  n_layers: 3 # Reduced from 4
  hidden_dim: 64 # Reduced from 128
  time_emb_dim: 64 # Reduced from 128

diffusion:
  T: 500 # Reduced from 1000
  beta_start: 0.0001
  beta_end: 0.02
  schedule: "cosine"
  recenter_every_step: True

train:
  seed: 42
  epochs: 5 # Reduced from 10
  lr: 3.0e-4
  grad_clip: 1.0
  rot_aug: true

active_learning:
  exp_id: "day8_9_control_lite"
  out_dir: "runs/day8_9_control_lite"
  initial_seed_size: 100
  oracle_pool_source: "data/processed/ala2/shards"
  split_out_dir: "data/processed/ala2"
  seed_traj: 0
  val_traj: 2
  val_size: 1000 # Reduced val size
  n_iters: 3
  n_candidates: 500 # Reduced from 1000
  n_acquire: 200
  acquisition_strategy: "random" 
  finetune_epochs: 3 # Reduced from 5
  eval_samples: 500 # Reduced from 1000
  sample_batch_size: 100
  sample_steps: 50 # Reduced from 100 (using 500 T means steps < T is ok)
  sample_eta: 0.0
  oracle_batch_size: 100
  oracle_device: "cpu"
  rmsd_thresh: 0.75
  phi_psi_bins: 180
  seed: 123
