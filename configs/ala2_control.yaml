ensemble:
  exp_id: "day8_9_control"
  out_dir: "runs/day8_9_control"
  members: 3
  seeds: [111, 222, 333]

data:
  seed_path: "data/processed/ala2/al_seed.pt"
  pool_path: "data/processed/ala2/al_pool_ref.pt" # Should these point to split_3 if we want to be exact? 50_al_loop_3 used scripts/setup_al_split.py first to make split_3.
  # The user said "project workflow and session log loop b" - loop 3 was the valid one.
  # So we should probably use the same data split setup or point to existing split_3 files if they exist.
  # In 50_al_loop_3.slurm, it creates split_3.
  # Let's assume we want to match Loop 3 exactly.
  # But wait, run_al_loop.py takes config paths.
  # If we want "Everything else kept same", we should use the same initial seed data.
  # Checks: 50_al_loop_3.slurm runs setup_al_split.py -> data/processed/ala2/split_3
  # So we should point to that.
  seed_path: "data/processed/ala2/split_3/seed.pt" # matched to loop 3 logic?
  pool_path: "data/processed/ala2/split_3/pool.pt"
  val_path: "data/processed/ala2/split_3/val.pt"
  meta_path: "data/processed/ala2/meta.pt"
  batch_size: 256
  num_workers: 4

model:
  type: "egnn"
  n_layers: 4
  hidden_dim: 128
  time_emb_dim: 128

diffusion:
  T: 1000
  beta_start: 0.0001
  beta_end: 0.02
  schedule: "cosine"
  recenter_every_step: True

train:
  seed: 42
  epochs: 10
  lr: 3.0e-4
  grad_clip: 1.0
  rot_aug: true

active_learning:
  exp_id: "day8_9_control"
  out_dir: "runs/day8_9_control"
  initial_seed_size: 100 # Loop 3 used 5000 in setup script, but here config says 100?
  # In 50_al_loop_3.slurm: --seed-size 5000.
  # The run_al_loop.py uses 'seed_path' which is generated by setup_al_split.
  # So 'initial_seed_size' in config might be ignored if seed_path exists?
  # Let's check run_al_loop.py... 
  # It just loads seed_data = load_al_data(seed_path). 
  # So the YAML 'initial_seed_size' is likely unused or for legacy setup.
  oracle_pool_source: "data/processed/ala2/shards"
  split_out_dir: "data/processed/ala2"
  seed_traj: 0
  val_traj: 2
  val_size: 2000
  n_iters: 3
  n_candidates: 1000
  n_acquire: 200
  acquisition_strategy: "random" # THE KEY CHANGE
  finetune_epochs: 5
  eval_samples: 1000
  sample_batch_size: 200
  sample_steps: 100
  sample_eta: 0.0
  oracle_batch_size: 100
  oracle_device: "cpu"
  rmsd_thresh: 0.75
  phi_psi_bins: 180
  seed: 123
