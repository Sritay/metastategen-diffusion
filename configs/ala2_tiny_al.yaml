ensemble:
  exp_id: "tiny_al_test"
  out_dir: "runs/tiny_al_test"
  members: 2
  seeds: [111, 222]

data:
  seed_path: "data/processed/ala2/al_seed.pt"
  pool_path: "data/processed/ala2/al_pool_ref.pt"
  val_path: "data/processed/ala2/al_val.pt"
  meta_path: "data/processed/ala2/meta.pt"
  batch_size: 16
  num_workers: 0

model:
  type: "egnn"
  n_layers: 2
  hidden_dim: 32
  time_emb_dim: 32
  use_chiral_features: true

diffusion:
  T: 50
  beta_start: 0.0001
  beta_end: 0.02
  schedule: "cosine"
  recenter_every_step: True

train:
  seed: 42
  epochs: 1
  lr: 3.0e-4
  grad_clip: 1.0
  rot_aug: true

active_learning:
  exp_id: "tiny_al_test"
  out_dir: "runs/tiny_al_test"
  initial_seed_size: 50
  oracle_pool_source: "data/processed/ala2/shards"
  split_out_dir: "runs/tiny_al_test/split"
  seed_traj: 0
  val_traj: -1
  val_size: 100
  n_iters: 1
  n_candidates: 20
  n_acquire: 5
  acquisition_strategy: "uncertainty"
  finetune_epochs: 1
  eval_samples: 10
  sample_batch_size: 10
  sample_steps: 10
  sample_eta: 0.0
  oracle_batch_size: 10
  oracle_device: "cpu"
  rmsd_thresh: 0.75
  phi_psi_bins: 180
  seed: 123
