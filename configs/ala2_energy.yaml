project: "metastategen-energy"
experiment_name: "energy_surrogate_ala2"

data:
  forces_path: "data/processed/ala2/al_forces_ref.pt"
  energies_path: "data/processed/ala2/al_energies_ref.pt"
  processed_dir: "data/processed/ala2/shards"
  batch_size: 256
  num_workers: 4
  train_trajs: [0]
  val_trajs: [1]
  # subsample: 1

model:
  n_atom_types: 5 # C, N, O, S, other
  hidden_dim: 256
  n_layers: 6
  dropout: 0.0
  use_rbf: true
  rbf_dim: 64
  rbf_cutoff: 1.0

training:
  lr: 3.0e-4
  weight_decay: 1.0e-6
  max_epochs: 100
  patience: 20
  grad_clip: 1.0
  energy_weight: 0.01  # Loss = MSE_F + 0.01 * MSE_E
  save_every: 10

logging:
  log_every_n_steps: 50
  wandb: true
