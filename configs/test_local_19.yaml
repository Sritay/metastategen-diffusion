
ensemble:
  exp_id: test_local_19
  out_dir: runs/test_local_19
  members: 1
  seeds:
  - 42
data:
  seed_path: data/processed/ala2/split_12/al_seed.pt
  pool_path: data/processed/ala2/split_12/al_pool_ref.pt
  val_path: data/processed/ala2/split_12/al_val.pt
  meta_path: data/processed/ala2/meta.pt
  batch_size: 16
  num_workers: 0
  scale_factor: 7.6
model:
  type: egnn
  n_layers: 2
  hidden_dim: 32
  time_emb_dim: 32
  use_rbf: true
  rbf_dim: 16
  rbf_cutoff: 20.0
  use_chiral_features: true
diffusion:
  T: 10
  beta_start: 0.0001
  beta_end: 0.02
  schedule: cosine
  recenter_every_step: true
train:
  seed: 42
  epochs: 1
  lr: 0.0003
  grad_clip: 1.0
  rot_aug: true
active_learning:
  exp_id: test_local_19
  out_dir: runs/test_local_19
  condition_strategy: uniform
  condition_range: [0.01, 0.08]
  initial_seed_size: 100
  oracle_pool_source: data/processed/ala2/shards
  split_out_dir: data/processed/ala2/split_12
  seed_traj: 0
  val_traj: -1
  val_size: 100
  n_iters: 1
  n_candidates: 10
  n_acquire: 5
  acquisition_strategy: uncertainty
  finetune_epochs: 1
  eval_samples: 10
  sample_batch_size: 10
  sample_steps: 5
  sample_eta: 0.0
  oracle_batch_size: 10
  oracle_device: cpu
  rmsd_thresh: 0.15
  phi_psi_bins: 180
