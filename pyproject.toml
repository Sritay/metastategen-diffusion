[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metastategen"
version = "0.2.0"
description = "Metastable state generation with equivariant diffusion (Day-1: data + eval pipeline)."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "metastategen-diffusion contributors"}]
dependencies = [
  "numpy<2",
  "scipy",
  "matplotlib",
  "pyyaml",
  "torch",
  "tqdm",
  "rich",
  "mdshare",
  "pandas",
  "wandb",
]

[project.scripts]
msgen = "metastategen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

